<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ELO</title>

  <!-- Bootstrap 5 (usado para o sistema de modais) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h2>ELO</h2>
    <p class="muted">Seu espaço para criar, organizar e acompanhar projetos.</p>

    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="email" />
    <input type="password" id="loginPassword" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" />

    <p id="loginError" class="login-error"></p>

    <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>
    <button id="btnSignup" class="btn btn-secondary w-100">Criar conta</button>
    <a href="#" id="btnForgotPassword" class="login-forgot">Esqueci minha senha</a>
  </div>
</div>

<!-- APP -->
<div class="app-container" id="appContainer" style="display:none;">

  <header class="os-topbar">
    <div class="os-topbar-brand">
      <span class="os-logo">ELO</span>
      <span class="os-logo-sub">Seu espaço para criar, organizar e acompanhar projetos.</span>
    </div>
    <button id="btnLogout" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Sair</button>
  </header>

  <main class="os-main">

    <!-- DESKTOP: TELA INICIAL -->
    <section id="desktopView">
      <div class="desktop-header">
        <div>
          <h1>Seus projetos</h1>
          <p class="desktop-subtitle">O espaço central para organizar tudo o que você está construindo.</p>
        </div>
        <button class="btn-pill btn-pill-primary" id="btnNewProject"><i class="bi bi-plus-lg"></i> Novo projeto</button>
      </div>

      <div class="desktop-toolbar">
        <input type="search" id="searchProjects" class="toolbar-input" placeholder="Buscar projetos...">
        <select id="filterCategory" class="toolbar-select"><option value="all">Todas as categorias</option></select>
        <select id="filterStatus" class="toolbar-select">
          <option value="all">Todos os status</option>
          <option value="started">No começo</option>
          <option value="progress">Em desenvolvimento</option>
          <option value="done">Finalizado</option>
        </select>
        <button type="button" class="btn-secondary-flat" id="toggleArchived">Ver arquivados</button>
        <button type="button" class="btn-secondary-flat" id="btnManageCategories"><i class="bi bi-tags"></i> Categorias</button>
      </div>

      <div id="projectsGrid" class="projects-grid"></div>
    </section>

    <!-- WORKSPACE DO PROJETO -->
    <section id="projectView" style="display:none;">
      <div class="project-view-header">
        <button id="backToDesktop" class="btn-back"><i class="bi bi-arrow-left"></i> Projetos</button>
        <div class="project-view-title-row">
          <h1 id="projectViewTitle"></h1>
          <div class="project-view-meta">
            <span id="projectViewCategory"></span>
            <span class="dot-sep">·</span>
            <span class="status-dot" id="projectViewStatusDot"></span>
            <span id="projectViewStatusLabel"></span>
          </div>
        </div>
      </div>

      <nav class="project-tabs">
        <button class="project-tab-btn active" data-tab="overview">Visão geral</button>
        <button class="project-tab-btn" data-tab="notes">Anotações</button>
        <button class="project-tab-btn" data-tab="tasks">Tarefas</button>
        <button class="project-tab-btn" data-tab="stats">Estatísticas</button>
        <button class="project-tab-btn" data-tab="resources">Recursos</button>
        <button class="project-tab-btn" data-tab="files">Arquivos</button>
        <button class="project-tab-btn" data-tab="settings">Configurações</button>
      </nav>

      <div id="projectTabContent" class="project-tab-content"></div>
    </section>

  </main>
</div>

<!-- MODAL: NOVO / EDITAR PROJETO -->
<div class="modal fade" id="projectModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content os-modal">
      <div class="modal-header">
        <h5 id="projectModalTitle">Novo projeto</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form id="projectForm">
        <div class="modal-body">

          <div class="project-form-grid">
            <div class="project-form-image">
              <label for="projectImageInput" class="image-upload-box">
                <img id="projectImagePreview" style="display:none">
                <span class="image-upload-placeholder"><i class="bi bi-image"></i> Adicionar imagem</span>
              </label>
              <input type="file" id="projectImageInput" accept="image/*" hidden>
            </div>

            <div class="project-form-fields">
              <label class="field-label">Nome</label>
              <input type="text" id="projectName" required placeholder="Nome do projeto">

              <label class="field-label">Descrição</label>
              <textarea id="projectDescription" rows="2" placeholder="Descrição opcional"></textarea>

              <label class="field-label">Categoria</label>
              <div class="field-row">
                <select id="projectCategory"></select>
                <button type="button" class="btn-secondary-flat" id="btnOpenNewCategoryFromProject">+ Nova</button>
              </div>
            </div>
          </div>

          <label class="field-label">Status</label>
          <div class="status-choice-group">
            <label class="status-choice">
              <input type="radio" name="statusChoice" value="started" checked>
              <span class="status-dot status-dot-started"></span> No começo
            </label>
            <label class="status-choice">
              <input type="radio" name="statusChoice" value="progress">
              <span class="status-dot status-dot-progress"></span> Em desenvolvimento
            </label>
            <label class="status-choice">
              <input type="radio" name="statusChoice" value="done">
              <span class="status-dot status-dot-done"></span> Finalizado
            </label>
          </div>

          <div class="two-col">
            <div>
              <label class="field-label">Prioridade</label>
              <select id="projectPriority">
                <option value="low">Baixa</option>
                <option value="normal" selected>Normal</option>
                <option value="high">Alta</option>
              </select>
            </div>
            <div></div>
          </div>

          <div class="two-col">
            <div>
              <label class="field-label">Data de início</label>
              <input type="date" id="projectStartDate">
            </div>
            <div>
              <label class="field-label">Prazo (opcional)</label>
              <input type="date" id="projectDueDate">
            </div>
          </div>

          <label class="field-label">Tags</label>
          <input type="text" id="projectTagsInput" placeholder="Digite e pressione Enter">
          <div class="tag-chip-list" id="projectTagsList"></div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary-flat" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-pill btn-pill-primary" id="saveProjectBtn">Salvar projeto</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL: CATEGORIAS -->
<div class="modal fade" id="categoriesModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content os-modal">
      <div class="modal-header">
        <h5>Categorias</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="categoryForm" class="inline-form">
          <input type="text" id="categoryIcon" placeholder="🎬" maxlength="4" style="max-width:70px">
          <input type="text" id="categoryName" placeholder="Nome da categoria" required>
          <button type="submit" class="btn-pill">Adicionar</button>
        </form>
        <div id="categoriesManagerList" class="categories-manager-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: ANOTAÇÃO -->
<div class="modal fade" id="noteModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content os-modal">
      <div class="modal-header">
        <h5 id="noteModalTitle">Nova anotação</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="noteForm">
        <div class="modal-body">
          <input type="text" id="noteTitleInput" placeholder="Título" class="note-title-input">
          <textarea id="noteContentInput" rows="10" placeholder="Escreva aqui..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary-flat" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-pill btn-pill-primary">Salvar anotação</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL: TAREFA -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content os-modal">
      <div class="modal-header">
        <h5 id="taskModalTitle">Nova tarefa</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="taskForm">
        <div class="modal-body">
          <label class="field-label">Nome</label>
          <input type="text" id="taskTitleInput" required placeholder="Nome da tarefa">

          <label class="field-label">Descrição</label>
          <textarea id="taskDescriptionInput" rows="2" placeholder="Descrição opcional"></textarea>

          <div class="two-col">
            <div>
              <label class="field-label">Prioridade</label>
              <select id="taskPriorityInput">
                <option value="low">Baixa</option>
                <option value="normal" selected>Normal</option>
                <option value="high">Alta</option>
              </select>
            </div>
            <div>
              <label class="field-label">Prazo</label>
              <input type="date" id="taskDueDateInput">
            </div>
          </div>

          <label class="field-label">Status</label>
          <select id="taskStatusInput">
            <option value="todo">A fazer</option>
            <option value="doing">Em andamento</option>
            <option value="done">Concluído</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary-flat" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-pill btn-pill-primary">Salvar tarefa</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="utils.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="desktop.js"></script>
<script src="project.js"></script>

</body>
</html>
